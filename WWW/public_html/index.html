  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#0d0d1a;min-height:100vh;overflow-x:hidden;color:#fff;}body::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(45deg,#ff00ff,#00ffff,#ff00ff);background-size:400% 400%;animation:gradientShift 15s ease infinite;opacity:0.1;z-index:-1;}@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}#login-container{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#121229;border-radius:12px;padding:40px;width:320px;box-shadow:0 0 25px rgba(0,255,255,0.3),inset 0 0 10px rgba(255,0,255,0.2);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px);animation:float 6s ease-in-out infinite;}@keyframes float{0%{transform:translate(-50%,-50%) translateY(0px);}50%{transform:translate(-50%,-50%) translateY(-10px);}100%{transform:translate(-50%,-50%) translateY(0px);}}.login-title{text-align:center;margin-bottom:30px;position:relative;}h2{margin:0;font-size:24px;background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;}input{width:100%;padding:12px 15px;margin-bottom:20px;background:#1e1e3a;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:14px;box-sizing:border-box;transition:all 0.3s ease;}input:focus{outline:none;border-color:#00ffff;box-shadow:0 0 10px rgba(0,255,255,0.3);}button{width:100%;padding:12px;background:linear-gradient(90deg,#00ffff,#ff00ff);border:none;border-radius:6px;color:#000;font-weight:600;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden;}button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:all 0.5s ease;}button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,255,255,0.4);}button:hover::before{left:100%;}.key-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#666;font-size:12px;letter-spacing:0.5px;}@keyframes pulse{0%{opacity:0.6;}50%{opacity:1;}100%{opacity:0.6;}}.pulse{animation:pulse 2s infinite;}</style>
